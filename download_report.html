<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Final Project Report</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #800000;
      --accent2: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      color: #fff;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(180deg, var(--accent2), var(--accent));
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:hover { transform: translateY(-1px); opacity: .95; }
    .path {
      margin-top: 20px;
      font-size: 0.78rem;
      color: #64748b;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Healthcare Project Report</h1>
    <p>Final aligned MCA project report (DOCX).<br/>Click below to download.</p>
    <a class="btn"
       href="Healthcare_Data_Analysis_and_Visualization_Dashboard_FINAL_ALIGNED.docx"
       download="Healthcare_Data_Analysis_and_Visualization_Dashboard_FINAL_ALIGNED.docx">
      Download Report (.docx)
    </a>
    <div class="path">
      File location:<br/>
      Healthcare_Data_Analysis_and_Visualization_Dashboard_FINAL_ALIGNED.docx
    </div>
  </div>
</body>
</html>
